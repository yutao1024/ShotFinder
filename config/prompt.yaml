MATCH_PROMPT: |
    **Role:** You are a Visual Frame Grounding Specialist. Your task is to identify the single most relevant frame that best matches the user's description.

    **Context:**
    The input consists of multiple images extracted from a video.
    The images are provided in strict chronological order, from the beginning to the end of the video.
    Each image is a representative frame of one video shot, where the frame is sampled approximately from the temporal middle of that shot.
    The first image has frame_id = 0, the second image has frame_id = 1, and so on.
    In addition to images, you are also given the full audio track of the video.
    The audio is not segmented per frame or shot and should be used as global temporal and semantic context, not as a direct frame-to-audio alignment.

    **Shot Metadata:**
    For each frame, the corresponding shot's temporal boundaries are provided as start_time and end_time.
    Each frame_id identifies a representative frame of one shot, and the corresponding start_time and end_time specify the temporal extent of that shot.

    **Shot Metadata format:**
    frame_id = 0, start_time = <seconds>, end_time = <seconds>
    frame_id = 1, start_time = <seconds>, end_time = <seconds>
    ...

    **Shot Metadata for this video:**
    $SHOT_METADATA$

    **Target Description (The event to find):** "$en_memory_data$"

    **Instructions:**

    **1. Joint Reasoning with Vision, Audio, and Shot Metadata:**
    Use the text description, visual content of all frames, the audio track, and the Shot Metadata together.
    Use audio cues (e.g., speech, sound events, changes in intensity) to infer when the described event occurs.
    Use the start_time and end_time of each shot to determine which shot covers or is closest to the inferred event time.
    Use visual evidence from the representative frames to determine which frame best represents the described event.

    **2. Scan All Frames:** Analyze all provided images in chronological order.
    Consider both the visual-semantic similarity between the target description and each frame and the temporal consistency between the inferred event time and the corresponding shot's start_time and end_time.

    **3. Select the Best Match:** Identify the single frame whose visual content is most relevant to the target description.
    If the target event occurs within a shot's temporal interval, prefer the representative frame of that shot.
    If multiple shots partially match, choose the frame from the shot that provides the strongest combination of visual relevance, semantic relevance, and temporal proximity to the inferred event.
    If the event occurs near a boundary between two shots, compare the neighboring shots and select the most relevant frame.
    If the audio provides weak or ambiguous temporal information, select the most semantically and visually related frame.

    **4. Important Temporal Reasoning Rule:**
    Do not assume that frame_id corresponds to a uniformly sampled timestamp.
    Each frame_id identifies the representative frame of a particular shot.
    Use the provided start_time and end_time to reason about the temporal location of each shot.
    The approximate representative time of a shot may be considered as t_i = (start_time_i + end_time_i) / 2.
    However, the actual visual evidence should take precedence over this approximate representative time when selecting the best match.

    **5. Mandatory Selection Rule:**
    You must return exactly one valid frame_id. The frame_id must be an integer between 0 and $NUM_FRAMES$ - 1. Do not return "N/A", null, or multiple values.

    **Output Format (JSON Only):**
    <tool_call>{"frame_id": <integer>}</tool_call>

TEST_PROMPT: |
   You are an expert AI visual analyst.

   I will provide:
   1. A text description.
   2. A Reference Ground Truth image (first image).
   3. A Candidate Frame from a video (second image).

   Task:
   Determine whether the Candidate Frame is an ACCEPTABLE match.

   Evaluation criteria:

   1. Text Match:
      Does the visual content of the Candidate Frame clearly correspond to the key entities,
      actions, or scenes described in the text?
      Minor omissions or variations are acceptable, but the core semantic meaning must be preserved.

   2. Image Match:
      Is the Candidate Frame semantically consistent with the Reference Ground Truth image?
      It should depict the same scene, event, or key visual elements,
      allowing for reasonable differences in camera angle, lighting, scale, or moment in time.
      The match should go beyond generic similarity and reflect shared visual intent.

   Target text description:
   $Text_Content$

   Return ONLY a JSON object:
   {
      "text_match": true/false,
      "image_match": true/false
   }


